name: Publish app after merged PR
on:
  workflow_run:
    workflows: [Android build and checks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - name: Require a merged PR for the exact tested commit
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {...context.repo, commit_sha: sha});
            const pr = prs.find(p => p.merged_at && p.base.ref === 'main' && p.merge_commit_sha === sha);
            core.setOutput('allowed', pr ? 'true' : 'false');
            if (!pr) core.notice('No merged PR for this exact main commit: no release.');
      - uses: actions/checkout@v5
        if: steps.gate.outputs.allowed == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Plan unique version for the successful main build
        if: steps.gate.outputs.allowed == 'true'
        id: version
        env:
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 scripts/test-release-plan.py
          python3 scripts/release-plan.py "$BUILD_NUMBER" "$BUILD_SHA" > release-plan.json
          python3 - <<'PY'
          import json, os
          p=json.load(open('release-plan.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for key,value in p.items(): f.write(f'{key}={value}\n')
          PY
      - name: Never replace an existing release or asset
        if: steps.gate.outputs.allowed == 'true'
        id: existing
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            try {
              const r = await github.rest.repos.getReleaseByTag({...context.repo, tag:process.env.RELEASE_TAG});
              core.setOutput('found','true');
              core.notice(`Release already exists, left unchanged: ${r.data.html_url}`);
            } catch (e) { if(e.status !== 404) throw e; core.setOutput('found','false'); }
      - uses: actions/setup-java@v5
        if: steps.gate.outputs.allowed == 'true' && steps.existing.outputs.found != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.gate.outputs.allowed == 'true' && steps.existing.outputs.found != 'true'
      - name: Build versioned APKs and repeat unit checks
        if: steps.gate.outputs.allowed == 'true' && steps.existing.outputs.found != 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug -PreleaseVersion="$APP_VERSION" -PreleaseCode="$APP_CODE"
      - name: Sign APKs with the existing pinned app identity
        if: steps.gate.outputs.allowed == 'true' && steps.existing.outputs.found != 'true'
        env:
          PDF_FOCUS_TEST_SIGNING_BUNDLE: ${{ secrets.PDF_FOCUS_TEST_SIGNING_BUNDLE }}
          PDF_FOCUS_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/sign-release-apks.py
      - name: Create draft, upload completely, then publish
        if: steps.gate.outputs.allowed == 'true' && steps.existing.outputs.found != 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const draft = await github.rest.repos.createRelease({...context.repo, tag_name:process.env.RELEASE_TAG, target_commitish:process.env.RELEASE_SHA, name:`PDF Focus Reader ${process.env.APP_VERSION}`, draft:true, prerelease:false, generate_release_notes:true});
            try {
              for (const name of fs.readdirSync('signed-release').sort()) {
                await github.rest.repos.uploadReleaseAsset({...context.repo, release_id:draft.data.id, name, data:fs.readFileSync(`signed-release/${name}`)});
              }
              const published = await github.rest.repos.updateRelease({...context.repo, release_id:draft.data.id, draft:false, make_latest:'true'});
              await core.summary.addLink('Download PDF Focus Reader',published.data.html_url).write();
            } catch (error) {
              core.error(`Upload incomplete. Draft ${draft.data.id} retained, not published; no existing assets replaced.`);
              throw error;
            }
