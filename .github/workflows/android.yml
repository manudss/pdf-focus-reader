name: Android build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test automatic release version planning
        run: python3 scripts/test-release-plan.py
      - name: Build stable release identity without signing
        run: ./gradlew --no-daemon assembleRelease -PreleasePackage=com.pdffocus.reader -PreleaseLabel="PDF Focus Reader" -PreleaseVersion=1.0.0 -PreleaseCode=100000
      - name: Build, unit tests and lint
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pdf-focus-reader-alpha
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
          retention-days: 14
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell settings put global airplane_mode_on 1
            ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.pdffocus.reader.test.test/androidx.test.runner.AndroidJUnitRunner | tee device-tests.txt
            adb logcat -d > device-logcat.txt
            adb pull /sdcard/Android/data/com.pdffocus.reader.test/files/screenshots app/build/device-screenshots || true
            grep -q 'OK (45 tests)' device-tests.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-device-test-results
          path: |
            device-tests.txt
            device-logcat.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/device-screenshots/
          retention-days: 14

  sign-test:
    needs: [build, device-tests]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'test/morning-improvements' || github.event.pull_request.head.ref == 'feat/guided-reader' || github.event.pull_request.head.ref == 'fix/reading-wide-title-columns' || github.event.pull_request.head.ref == 'feat/page-navigation' || github.event.pull_request.head.ref == 'feat/auto-select' || github.event.pull_request.head.ref == 'fix/reading-pinch-zoom' || github.event.pull_request.head.ref == 'feat/comic-reading-mode' || github.event.pull_request.head.ref == 'test/comic-continuous-detail' || github.event.pull_request.head.ref == 'test/comic-reading-gutters' || github.event.pull_request.head.ref == 'feat/seam-panel-detection')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v5
        with:
          name: pdf-focus-reader-alpha
          path: app/build
      - name: Restore approved signing secret and sign only test APK
        env:
          PDF_FOCUS_TEST_SIGNING_BUNDLE: ${{ secrets.PDF_FOCUS_TEST_SIGNING_BUNDLE }}
        run: python3 scripts/sign-test-apk.py
      - uses: actions/upload-artifact@v5
        with:
          name: pdf-focus-test-signed
          path: signed-test/
          retention-days: 14

  sign-stable-candidate:
    needs: [build, device-tests]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'ci/releases-after-merge' || github.event.pull_request.head.ref == 'release/v1.0')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Build stable 1.0.0 release candidate
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease -PreleasePackage=com.pdffocus.reader -PreleaseLabel="PDF Focus Reader" -PreleaseVersion=1.0.0 -PreleaseCode=100000
      - name: Sign with dedicated stable certificate and verify final metadata
        env:
          PDF_FOCUS_STABLE_SIGNING_BUNDLE: ${{ secrets.PDF_FOCUS_STABLE_SIGNING_BUNDLE }}
          PDF_FOCUS_RELEASE_VERSION: 1.0.0
          PDF_FOCUS_RELEASE_CODE: 100000
        run: python3 scripts/sign-release-apks.py
      - uses: actions/upload-artifact@v5
        with:
          name: pdf-focus-stable-signed
          path: signed-release/
          retention-days: 14
      - name: Enable KVM for final signed stable smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/smoke-stable.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: stable-signed-smoke
          path: stable-smoke/
          retention-days: 14

  publish-test-prerelease:
    needs: [sign-test]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/seam-panel-detection'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: pdf-focus-test-signed
          path: signed-test
      - uses: actions/download-artifact@v5
        with:
          name: android-device-test-results
          path: device-results
      - name: Package emulator evidence (fictional test document only)
        run: |
          set -euo pipefail
          find device-results -name '*.png' | sort | tee evidence-list.txt
          test -s evidence-list.txt
          grep -q 'OK (' device-results/device-tests.txt
          (cd device-results && zip -qr ../emulator-evidence.zip device-tests.txt app/build/device-screenshots)
          ls -l emulator-evidence.zip
      - name: Verify package, version, certificate and checksum before publishing
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=$(ls signed-test/pdf-focus-test-*-arm64.apk)
          test "$(ls signed-test/pdf-focus-test-*-arm64.apk | wc -l)" = 1
          "$BT/aapt" dump badging "$APK" | head -1 | tee verify.txt
          grep -q "package: name='com.pdffocus.reader.test' versionCode='18' versionName='0.10.17-test'" verify.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee certs.txt
          grep -q 'certificate SHA-256 digest: bbdae9f61a83de058513b89ba9e57af2ac2e29831a5c25e7445a30c7e8f0ea16' certs.txt
          (cd signed-test && sha256sum -c SHA256SUMS.txt --ignore-missing 2>/dev/null || true)
          EXPECTED=$(head -1 signed-test/SHA256SUMS.txt | cut -d' ' -f1)
          ACTUAL=$(sha256sum "$APK" | cut -d' ' -f1)
          test "$EXPECTED" = "$ACTUAL"
          echo "Verified $APK sha256 $ACTUAL" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish Test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh release create v0.10.17-test --repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" --prerelease --title "PDF Focus Test 0.10.17" --notes "Test prerelease (package com.pdffocus.reader.test, in-place update over Test 0.10.16). Seam-cut panel detection for frameless comic pages in Comic and Manga modes: thin gutters and hanging speech balloons no longer fuse panels or fall back to the whole page. Built from commit $HEAD_SHA. Experimental: no diagonal panels, no old coloured scans. Stable app untouched." signed-test/pdf-focus-test-0.10.17-arm64.apk signed-test/SHA256SUMS.txt emulator-evidence.zip
          gh release view v0.10.17-test --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,isDraft,assets | tee -a "$GITHUB_STEP_SUMMARY"
