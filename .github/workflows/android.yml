name: Android build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test automatic release version planning
        run: python3 scripts/test-release-plan.py
      - name: Build stable release identity without signing
        run: ./gradlew --no-daemon assembleRelease -PreleasePackage=com.pdffocus.reader -PreleaseLabel="PDF Focus Reader" -PreleaseVersion=1.0.0 -PreleaseCode=100000
      - name: Build, unit tests and lint
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pdf-focus-reader-alpha
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
          retention-days: 14
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell settings put global airplane_mode_on 1
            ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.pdffocus.reader.test.test/androidx.test.runner.AndroidJUnitRunner | tee device-tests.txt
            adb logcat -d > device-logcat.txt
            adb pull /sdcard/Android/data/com.pdffocus.reader.test/files/screenshots app/build/device-screenshots || true
            grep -q 'OK (37 tests)' device-tests.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-device-test-results
          path: |
            device-tests.txt
            device-logcat.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/device-screenshots/
          retention-days: 14

  sign-test:
    needs: [build, device-tests]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'test/morning-improvements' || github.event.pull_request.head.ref == 'feat/guided-reader' || github.event.pull_request.head.ref == 'fix/reading-wide-title-columns' || github.event.pull_request.head.ref == 'feat/page-navigation' || github.event.pull_request.head.ref == 'feat/auto-select' || github.event.pull_request.head.ref == 'fix/reading-pinch-zoom')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v5
        with:
          name: pdf-focus-reader-alpha
          path: app/build
      - name: Restore approved signing secret and sign only test APK
        env:
          PDF_FOCUS_TEST_SIGNING_BUNDLE: ${{ secrets.PDF_FOCUS_TEST_SIGNING_BUNDLE }}
        run: python3 scripts/sign-test-apk.py
      - uses: actions/upload-artifact@v5
        with:
          name: pdf-focus-test-signed
          path: signed-test/
          retention-days: 14

  sign-stable-candidate:
    needs: [build, device-tests]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'ci/releases-after-merge' || github.event.pull_request.head.ref == 'release/v1.0')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Build stable 1.0.0 release candidate
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease -PreleasePackage=com.pdffocus.reader -PreleaseLabel="PDF Focus Reader" -PreleaseVersion=1.0.0 -PreleaseCode=100000
      - name: Sign with dedicated stable certificate and verify final metadata
        env:
          PDF_FOCUS_STABLE_SIGNING_BUNDLE: ${{ secrets.PDF_FOCUS_STABLE_SIGNING_BUNDLE }}
          PDF_FOCUS_RELEASE_VERSION: 1.0.0
          PDF_FOCUS_RELEASE_CODE: 100000
        run: python3 scripts/sign-release-apks.py
      - uses: actions/upload-artifact@v5
        with:
          name: pdf-focus-stable-signed
          path: signed-release/
          retention-days: 14
      - name: Enable KVM for final signed stable smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p stable-smoke
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell am force-stop com.android.launcher3 || true
            adb install signed-release/pdf-focus-reader-1.0.0-x86_64.apk
            adb shell am start -W -n com.pdffocus.reader/.MainActivity
            adb shell dumpsys activity activities > stable-smoke/activities.txt
            grep -E 'com.pdffocus.reader/.*(MainActivity|TutorialActivity)' stable-smoke/activities.txt
            for attempt in $(seq 1 45); do
              adb shell uiautomator dump /sdcard/stable-ui.xml
              adb pull /sdcard/stable-ui.xml stable-smoke/ui.xml
              if grep -q 'Close app' stable-smoke/ui.xml; then
                python3 - <<'PY_UI'
            import xml.etree.ElementTree as ET, re, subprocess
            for node in ET.parse('stable-smoke/ui.xml').iter('node'):
                if node.get('text') == 'Close app':
                    x0,y0,x1,y1=map(int,re.findall(r'\d+',node.get('bounds')))
                    subprocess.run(['adb','shell','input','tap',str((x0+x1)//2),str((y0+y1)//2)],check=True)
            PY_UI
                adb shell am start -W -n com.pdffocus.reader/.MainActivity
              fi
              grep -q 'Choisir vos blocs' stable-smoke/ui.xml && break
              sleep 1
            done
            grep -q 'Choisir vos blocs' stable-smoke/ui.xml
            adb shell screencap -p /sdcard/stable-tutorial.png
            adb pull /sdcard/stable-tutorial.png stable-smoke/tutorial.png
            adb shell am force-stop com.pdffocus.reader
            adb shell run-as com.pdffocus.reader ls > stable-smoke/debug-access.txt 2>&1 && exit 1 || grep -q 'not debuggable' stable-smoke/debug-access.txt
            adb shell am start -W -n com.pdffocus.reader/.MainActivity
            adb logcat -d > stable-smoke/logcat.txt
            ! grep -q 'FATAL EXCEPTION' stable-smoke/logcat.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: stable-signed-smoke
          path: stable-smoke/
          retention-days: 14
